<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Club Penguin.exe · Coffee Shop</title>
  <meta name="description" content="The original 2010 Club Penguin Coffee Shop Flash room with an authentic blue puffle. Single-player, offline nostalgia viewer.">
  <style>
    :root { color-scheme: light; font-family: Tahoma, Verdana, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { background: radial-gradient(ellipse at 50% 38%, #226ab0 0%, #104d90 40%, #062858 100%); color: #fff; }
    .cp-shell { height: 100vh; height: 100dvh; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 7px; padding: 8px; overflow: hidden; }
    .cp-toolbar { width: min(100%, 1200px); min-height: 37px; display: flex; justify-content: space-between; align-items: center; gap: 9px; padding: 5px 10px; border: 2px solid #4eb4ff; border-radius: 11px; background: linear-gradient(#1889db, #0767b6); box-shadow: 0 2px 0 #064479, inset 0 1px #87d5ff; }
    .cp-title { font-weight: 900; color: #fff; font-size: clamp(12px, 2.2vw, 19px); letter-spacing: -.04em; text-shadow: 1px 2px #074777; white-space: nowrap; }
    .cp-counter { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 9px; border: 1px solid #11649b; background: #fff; color: #11588d; font-size: clamp(10px, 1.5vw, 13px); font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .cp-coin { width: 21px; height: 21px; display: grid; place-items: center; border-radius: 50%; border: 2px solid #d18e03; background: radial-gradient(circle at 25% 25%, #fff0a7, #ffc427 60%, #efa50e); color: #9b6500; box-shadow: inset 0 0 0 2px #ffe078; font-weight: 900; }
    .cp-game-viewport { position: relative; width: min(100%, calc((100dvh - 96px) * 1.58333333)); max-width: 1200px; min-height: 0; aspect-ratio: 760 / 480; overflow: hidden; flex: 0 1 auto; background: #a8d9fc; border: 3px solid #4dbbff; border-radius: 9px; box-shadow: 0 0 0 2px #064f8e, 0 8px 20px #001b3980; isolation: isolate; }
    #coffee-player, #coffee-player ruffle-player { display: block; width: 100%; height: 100%; }
    #coffee-player { position: absolute; inset: 0; }
    #coffee-player ruffle-player { position: absolute; inset: 0; }
    .cp-puffle { position: absolute; z-index: 3; width: 9%; left: 52%; top: 88%; transform: translate(-50%, -100%) scale(var(--puffle-scale, 1)); transform-origin: 50% 100%; pointer-events: none; filter: drop-shadow(0 3px 1px #17426c65); will-change: left, top, transform; }
    .cp-puffle img { display: block; width: 100%; height: auto; animation: cp-puffle-idle 3.8s ease-in-out infinite; }
    .cp-puffle.is-walking img { animation: none; }
    @keyframes cp-puffle-idle { 0%, 72%, 100% { transform: translateY(0); } 77% { transform: translateY(-2px); } 82% { transform: translateY(0); } }
    .cp-game-viewport { touch-action: none; cursor: pointer; }
    .cp-avatar { position: absolute; z-index: 4; left: 41%; top: 82%; width: 18%; aspect-ratio: 360 / 376; transform: translate(-50%, -100%) scale(var(--penguin-scale, 1)); transform-origin: 50% 100%; pointer-events: none; will-change: left, top, transform; }
    .cp-avatar img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .cp-avatar.is-facing-right img { transform: scaleX(-1); }
    .cp-avatar-name { position: absolute; top: 99%; left: 50%; transform: translateX(-50%); white-space: nowrap; font: bold clamp(8px, 1.45vw, 13px) Tahoma, sans-serif; color: #fff; text-shadow: -1px -1px #203b60, 1px -1px #203b60, -1px 1px #203b60, 1px 1px #203b60, 0 2px 2px #0008; }
    .cp-loading { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; padding: 16px; color: #073c69; text-align: center; font-size: 15px; font-weight: bold; background: linear-gradient(#e1f5ff, #a8d9fc); }
    .cp-loading[hidden] { display: none; }
    .cp-bottom { width: min(100%, 1200px); min-height: 27px; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #e5f5ff; font-size: 10px; text-shadow: 0 1px #062858; }
    .cp-bottom a, .cp-bottom button { color: #fff; font: bold 10px Tahoma, sans-serif; background: #1675b8; border: 1px solid #81cfff; border-radius: 7px; padding: 6px 10px; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .cp-bottom button:hover, .cp-bottom a:hover { background: #269ce0; }
    .cp-notice { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    /* The separate-tab view fills the browser viewport; true OS fullscreen
       still requires a user gesture, so the on-screen button remains. */
    body.cp-full-tab .cp-shell { padding: 0; gap: 0; }
    body.cp-full-tab .cp-toolbar { display: none; }
    body.cp-full-tab .cp-game-viewport { width: min(100vw, calc(100dvh * 1.58333333)); max-width: none; max-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
    body.cp-full-tab .cp-bottom { position: absolute; z-index: 5; bottom: 8px; left: 8px; right: 8px; width: auto; }
    body.cp-full-tab .cp-notice { display: block; max-width: calc(100vw - 140px); padding: 6px 9px; border-radius: 6px; background: #124a7acb; }
    @media (max-width: 520px) { .cp-shell { padding: 4px; gap: 4px; } .cp-toolbar { padding: 4px 5px; min-height: 32px; } .cp-counter { padding: 3px 5px; gap: 3px; } .cp-coin { width: 16px; height: 16px; font-size: 10px; } .cp-bottom { font-size: 9px; } .cp-bottom button { padding: 4px 5px; } }
    @media (prefers-reduced-motion: reduce) { .cp-puffle img { animation: none; } }
  </style>
  <script defer src="./ruffle/ruffle.js"></script>
  <script defer src="./js/club-penguin.js?v=20261104-kali-audio-focus"></script>
</head>
<body>
  <main class="cp-shell">
    <header class="cp-toolbar">
      <span class="cp-title">CLUB PENGUIN · COFFEE SHOP</span>
      <span class="cp-counter" aria-label="99,999,999,999 coins (display only)"><span class="cp-coin" aria-hidden="true">C</span> <span id="cp-coins">99,999,999,999</span> COINS</span>
    </header>
    <section class="cp-game-viewport" aria-label="Original Club Penguin Coffee Shop Flash room">
      <div id="coffee-player"></div>
      <p class="cp-loading" id="cp-loading" role="status">Loading the original Coffee Shop…</p>
      <div class="cp-puffle" id="cp-puffle" role="img" aria-label="An original blue puffle that follows Jordan">
        <img id="cp-puffle-sprite" src="./assets/club-penguin/blue-puffle-rest.webp" alt="" draggable="false">
      </div>
      <div class="cp-avatar" id="cp-avatar" role="img" aria-label="Jordan, controllable blue penguin">
        <img id="cp-avatar-sprite" src="./assets/clubpenguin/avatar/idle-1.webp" alt="" draggable="false">
        <span class="cp-avatar-name" aria-hidden="true">Jordan</span>
      </div>
    </section>
    <footer class="cp-bottom">
      <span class="cp-notice">CLICK / TAP TO WADDLE · ARROW KEYS OR WASD · OFFLINE SINGLE PLAYER</span>
      <button id="cp-fullscreen" type="button" aria-label="Toggle browser fullscreen">⛶ FULLSCREEN</button>
    </footer>
  </main>
  <script type="module" src="./js/club-penguin-avatar.js?v=20261104-puffle-follow"></script>
</body>
</html>

name: Remove three obsolete Pages archives

on:
  push:
    branches: [master]
    paths: [.github/workflows/purge-old-page-runs-once.yml]

permissions:
  actions: write

jobs:
  purge:
    if: github.repository == 'jordanhardee/jordanhardee.github.io' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete three old runs and their archived Pages artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 40955175869 40957763518 40953715364; do
            response=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            if [ "$response" != '204' ]; then
              echo "::error::Could not delete old run $run_id (HTTP $response)"
              exit 1
            fi
          done

          for artifact_id in 12933221812 12933104771 12931569282; do
            response=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")
            if [ "$response" != '404' ]; then
              echo "::error::Archived artifact $artifact_id still exists (HTTP $response)"
              exit 1
            fi
          done

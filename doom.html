<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>DOOM Shareware · JordanHardee.com</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #cfcfcf;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #screen { flex: 1; position: relative; min-height: 0; background: #000; }
  canvas {
    display: block; width: 100%; height: 100%;
    object-fit: contain; image-rendering: pixelated; outline: none;
    background: #000;
  }

  #boot {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; text-align: center; padding: 20px;
  }
  #boot.hidden { display: none; }
  #bootTitle { font-size: 26px; font-weight: 800; letter-spacing: 0.18em; color: #b81b1b; }
  #bootHint { margin-top: 8px; font-size: 12px; color: #b8a8a8; }
  #bootBtn {
    margin-top: 22px; border: 0; border-radius: 6px; padding: 14px 34px;
    background: #b81b1b; color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 0.1em;
  }
  #bootBtn[disabled] { background: #3a2020; color: #8a8a8a; }

  /* Visible log. The whole point is that a failure is legible without a
     desktop console — on a phone there is nowhere else for this to go. */
  #log {
    margin-top: 16px; width: 100%; max-width: 560px; height: 34vh; overflow: auto;
    background: #0b0b0b; border: 1px solid #222; border-radius: 6px; padding: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; line-height: 1.45;
    color: #8fb98f; text-align: left; white-space: pre-wrap; word-break: break-word;
  }
  #log .e { color: #ff8f8f; }
  #log .i { color: #6ea8ff; }

  #pad { flex: 0 0 auto; padding: 8px 10px 14px; background: #0a0a0a; }
  #pad.hidden { display: none; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .btn {
    border: 0; border-radius: 10px; background: #1c1c1c; color: #d8d8d8;
    font-size: 15px; font-weight: 600; height: 50px; min-width: 52px;
    display: flex; align-items: center; justify-content: center; flex: 1;
  }
  .btn:active, .btn.on { background: #b81b1b; color: #fff; }
  .btn.wide { flex: 1.6; }
  .btn.small { font-size: 11px; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div id="wrap">
  <div id="screen">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="boot">
      <div id="bootTitle">DOOM</div>
      <div id="bootHint">Original 1993 shareware · Episode 1 · Chocolate Doom WebAssembly</div>
      <button id="bootBtn" type="button" disabled>LOADING…</button>
      <div id="log"></div>
    </div>
  </div>

  <div id="pad" class="hidden">
    <div class="row">
      <button class="btn" data-key="ArrowLeft"  type="button">&#8630;</button>
      <button class="btn" data-key="ArrowUp"    type="button">&#9650;</button>
      <button class="btn" data-key="ArrowRight" type="button">&#8631;</button>
      <button class="btn small" data-key="KeyA" type="button">&lt; STR</button>
      <button class="btn small" data-key="KeyD" type="button">STR &gt;</button>
    </div>
    <div class="row">
      <button class="btn wide" data-key="Control"   type="button">FIRE</button>
      <button class="btn"      data-key="ArrowDown" type="button">&#9660;</button>
      <button class="btn wide" data-key="Space"     type="button">USE</button>
    </div>
    <div class="row">
      <button class="btn small" id="runToggle" type="button">RUN</button>
      <button class="btn small" data-key="Digit1" type="button">1</button>
      <button class="btn small" data-key="Digit2" type="button">2</button>
      <button class="btn small" data-key="Digit3" type="button">3</button>
      <button class="btn small" data-key="Enter"  type="button">ENT</button>
      <button class="btn small" data-key="Escape" type="button">MENU</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var boot = document.getElementById('boot');
  var bootBtn = document.getElementById('bootBtn');
  var pad = document.getElementById('pad');
  var logEl = document.getElementById('log');

  var lines = 0;
  function log(msg, cls) {
    if (lines++ > 400) { return; }
    var d = document.createElement('div');
    if (cls) { d.className = cls; }
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function info(m) { log(m, 'i'); }
  function err(m) { log(m, 'e'); }

  window.onerror = function (message, src, line) {
    err('EXCEPTION: ' + message + ' @' + line);
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    err('UNHANDLED REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  // ---- touch controls -------------------------------------------------
  // Chocolate Doom reads SDL key events on window. Dispatch exactly once to
  // window; dispatching to canvas AND document can make press/release collide.
  var KEYS = {
    ArrowUp:    { key: 'ArrowUp',    code: 'ArrowUp',     keyCode: 38 },
    ArrowDown:  { key: 'ArrowDown',  code: 'ArrowDown',   keyCode: 40 },
    ArrowLeft:  { key: 'ArrowLeft',  code: 'ArrowLeft',   keyCode: 37 },
    ArrowRight: { key: 'ArrowRight', code: 'ArrowRight',  keyCode: 39 },
    Control:    { key: 'Control',    code: 'ControlLeft', keyCode: 17 },
    Space:      { key: ' ',          code: 'Space',       keyCode: 32 },
    Shift:      { key: 'Shift',      code: 'ShiftLeft',   keyCode: 16 },
    Escape:     { key: 'Escape',     code: 'Escape',      keyCode: 27 },
    Enter:      { key: 'Enter',      code: 'Enter',       keyCode: 13 },
    KeyA:       { key: 'a',          code: 'KeyA',        keyCode: 65 },
    KeyD:       { key: 'd',          code: 'KeyD',        keyCode: 68 },
    Digit1:     { key: '1',          code: 'Digit1',      keyCode: 49 },
    Digit2:     { key: '2',          code: 'Digit2',      keyCode: 50 },
    Digit3:     { key: '3',          code: 'Digit3',      keyCode: 51 }
  };

  function send(type, name) {
    var k = KEYS[name];
    if (!k) { return; }
    var ev = new KeyboardEvent(type, {
      key: k.key, code: k.code, keyCode: k.keyCode, which: k.keyCode,
      bubbles: true, cancelable: true
    });
    try {
      Object.defineProperty(ev, 'keyCode', { get: function () { return k.keyCode; } });
      Object.defineProperty(ev, 'which',   { get: function () { return k.keyCode; } });
    } catch (e) { /* engine already reports these correctly */ }
    window.dispatchEvent(ev);
  }

  function bindHold(el, name) {
    var down = false;
    var pointerId = null;
    function press(ev) {
      ev.preventDefault();
      if (down) { return; }
      down = true;
      pointerId = ev.pointerId;
      try { el.setPointerCapture(pointerId); } catch (e) { /* Optional. */ }
      el.classList.add('on');
      send('keydown', name);
    }
    function release(ev) {
      if (ev && ev.preventDefault) { ev.preventDefault(); }
      if (ev && ev.pointerId !== undefined && ev.pointerId !== pointerId) { return; }
      if (!down) { return; }
      down = false;
      pointerId = null;
      el.classList.remove('on');
      send('keyup', name);
    }
    // Pointer Events cover mouse and multi-touch without compatibility mouse
    // events causing duplicate input (the original on-screen-control bug).
    el.addEventListener('pointerdown', press);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
    window.addEventListener('blur', function () { release(null); });
  }

  var btns = document.querySelectorAll('.btn[data-key]');
  for (var i = 0; i < btns.length; i++) {
    bindHold(btns[i], btns[i].getAttribute('data-key'));
  }

  var runOn = false;
  var runToggle = document.getElementById('runToggle');
  runToggle.addEventListener('click', function () {
    runOn = !runOn;
    runToggle.classList.toggle('on', runOn);
    send(runOn ? 'keydown' : 'keyup', 'Shift');
  });

  // ---- emscripten module ----------------------------------------------
  // Mirrors the upstream launcher's known-good sequence: never auto-run main,
  // preload the data files as run-dependencies, then callMain() explicitly.
  var PRELOAD = ['doom1.wad', 'default.cfg'];
  var started = false;
  var saveKey = 'jordanhardee-doom-shareware-saves-v1';
  var lastSaved = '';

  function restoreSaves() {
    try {
      var data = JSON.parse(localStorage.getItem(saveKey) || '{}');
      Object.keys(data).forEach(function (filename) {
        if (!/^doomsav[0-9]\.dsg$/.test(filename)) { return; }
        var bytes = Uint8Array.from(atob(data[filename]), function (char) { return char.charCodeAt(0); });
        window.Module.FS.writeFile('/savefiles/' + filename, bytes);
      });
    } catch (e) { err('[saves] restore unavailable: ' + e.message); }
  }

  function persistSaves() {
    try {
      var files = window.Module.FS.readdir('/savefiles').filter(function (name) {
        return /^doomsav[0-9]\.dsg$/.test(name);
      });
      var data = {};
      files.forEach(function (name) {
        var bytes = window.Module.FS.readFile('/savefiles/' + name);
        var binary = '';
        for (var i = 0; i < bytes.length; i += 8192) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        }
        data[name] = btoa(binary);
      });
      var serialized = JSON.stringify(data);
      if (serialized !== lastSaved) {
        localStorage.setItem(saveKey, serialized);
        lastSaved = serialized;
      }
    } catch (e) { /* Private browsing or a full quota must not stop play. */ }
  }

  window.Module = {
    canvas: canvas,
    noInitialRun: true,
    noExitRuntime: true,

    print: function (t) { log(String(t)); },
    printErr: function (t) { err(String(t)); },
    setStatus: function (t) { if (t) { info('[status] ' + t); } },

    monitorRunDependencies: function (left) {
      info('[deps] remaining: ' + left);
    },

    preRun: function () {
      try { window.Module.FS.mkdir('/savefiles'); } catch (e) { /* already exists */ }
      restoreSaves();
      PRELOAD.forEach(function (f) {
        info('[preload] ' + f);
        // parent "" + canOwn=true is what this build expects.
        window.Module.FS.createPreloadedFile('', f, 'assets/doom/' + f, true, true);
      });
    },

    onRuntimeInitialized: function () {
      info('[runtime] initialized');
      try {
        var found = window.Module.FS.readdir('/').join(' ');
        info('[fs] /: ' + found);
      } catch (e) { err('[fs] readdir failed: ' + e); }
      bootBtn.disabled = false;
      bootBtn.textContent = 'TAP TO START';
    },

    onExit: function (status) {
      err('[exit] status ' + status);
    }
  };

  bootBtn.addEventListener('click', function () {
    if (started) { return; }
    started = true;
    bootBtn.disabled = true;
    bootBtn.textContent = 'STARTING…';
    info('[main] callMain');

    canvas.focus();

    // Single-player only. The upstream launcher also passes -servername /
    // -autojoin for its WebSockets multiplayer; those make the client look for
    // a game server, which is not wanted here.
    var args = [
      '-iwad', 'doom1.wad',
      '-window',
      '-nogui',
      '-nomusic',
      '-config', 'default.cfg',
      '-savedir', '/savefiles'
    ];

    try {
      // eslint-disable-next-line no-undef
      callMain(args);
      info('[main] returned');
      boot.classList.add('hidden');
      pad.classList.remove('hidden');
      // Chocolate Doom writes its save slots to MEMFS; mirror them to this
      // browser so F2/ESC → Save Game survives a refresh without a backend.
      setInterval(persistSaves, 2000);
      window.addEventListener('pagehide', persistSaves);
    } catch (e) {
      err('[main] threw: ' + (e && e.message ? e.message : e));
      bootBtn.disabled = false;
      bootBtn.textContent = 'RETRY';
      started = false;
    }
  });

  info('[boot] loading engine…');
  var s = document.createElement('script');
  s.src = 'assets/doom/websockets-doom.js';
  s.onerror = function () { err('[boot] failed to load websockets-doom.js'); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
